<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>सरकारी योजना खोजें 🇮🇳</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #ff7a00, #e63900);
      color: white;
      padding: 28px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      margin-top: -20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ff6b00;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #e85e00;
    }

    .status {
      text-align: center;
      margin: 20px 0;
      color: #666;
    }

    .schemes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .card h3 {
      color: #e85d04;
      margin-bottom: 10px;
    }

    .card p {
      line-height: 1.7;
      color: #555;
      font-size: 14px;
    }

    .tag {
      display: inline-block;
      background: #fff0e5;
      color: #d35400;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin: 8px 0;
    }

    .apply {
      display: inline-block;
      margin-top: 12px;
      padding: 9px 14px;
      background: #198754;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 30px;
      background: #222;
      color: white;
      font-size: 13px;
    }

    .ai-box {
      background: #fff;
      margin-top: 25px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .ai-answer {
      margin-top: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<header>
  <h1>🇮🇳 सरकारी योजना खोजें</h1>
  <p>भारत सरकार की योजनाओं की जानकारी आसान हिंदी में</p>
</header>

<div class="container">

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="जैसे: किसानों के लिए योजना, छात्रवृत्ति, महिलाओं की योजना..."
    >

    <button onclick="searchSchemes()">
      🔍 योजना खोजें
    </button>
  </div>

  <div id="status" class="status">
    लोकप्रिय सरकारी योजनाएँ
  </div>

  <div id="schemes" class="schemes"></div>

  <div class="ai-box">
    <h2>🤖 AI योजना सहायक</h2>

    <p style="margin-top:8px;color:#666;">
      किसी भी सरकारी योजना के बारे में हिंदी में सवाल पूछें।
    </p>

    <input
      id="question"
      style="margin-top:15px"
      placeholder="उदाहरण: प्रधानमंत्री किसान योजना किसके लिए है?"
    >

    <button onclick="askAI()">
      🤖 Grok से पूछें
    </button>

    <div id="aiAnswer" class="ai-answer"></div>
  </div>

</div>

<footer>
  © 2026 सरकारी योजना खोजें | जानकारी के लिए आधिकारिक सरकारी वेबसाइट देखें
</footer>


<script>

  /*
    IMPORTANT:
    Browser में API key रखना सुरक्षित नहीं है।

    Production website में Grok API को अपने backend/server
    से call करें।

    Demo के लिए नीचे key डाल सकते हैं,
    लेकिन public website में ऐसा DON'T करें.
  */

  const XAI_API_KEY = "YOUR_XAI_API_KEY";

  const schemes = [

    {
      name: "प्रधानमंत्री किसान सम्मान निधि",
      category: "किसान",
      description:
        "पात्र किसानों को कृषि सहायता के लिए आर्थिक सहायता प्रदान करने वाली केंद्र सरकार की योजना।",
      url: "https://pmkisan.gov.in/"
    },

    {
      name: "प्रधानमंत्री जन धन योजना",
      category: "बैंकिंग",
      description:
        "लोगों को बैंकिंग सेवाओं और वित्तीय समावेशन से जोड़ने की सरकारी पहल।",
      url: "https://pmjdy.gov.in/"
    },

    {
      name: "आयुष्मान भारत प्रधानमंत्री जन आरोग्य योजना",
      category: "स्वास्थ्य",
      description:
        "पात्र परिवारों को स्वास्थ्य सेवाओं का लाभ उपलब्ध कराने वाली प्रमुख सरकारी योजना।",
      url: "https://pmjay.gov.in/"
    },

    {
      name: "प्रधानमंत्री आवास योजना",
      category: "आवास",
      description:
        "पात्र परिवारों को किफायती आवास उपलब्ध कराने के उद्देश्य से चलाई जाने वाली सरकारी योजना।",
      url: "https://pmaymis.gov.in/"
    },

    {
      name: "बेटी बचाओ बेटी पढ़ाओ",
      category: "महिला एवं बाल",
      description:
        "बालिकाओं की सुरक्षा, शिक्षा और सामाजिक स्थिति को बेहतर बनाने के उद्देश्य से पहल।",
      url: "https://wcd.gov.in/"
    },

    {
      name: "प्रधानमंत्री उज्ज्वला योजना",
      category: "महिला",
      description:
        "पात्र परिवारों को स्वच्छ खाना पकाने के ईंधन की सुविधा उपलब्ध कराने की सरकारी पहल।",
      url: "https://www.pmuy.gov.in/"
    }

  ];


  function displaySchemes(list) {

    const container = document.getElementById("schemes");

    container.innerHTML = "";

    if (list.length === 0) {

      container.innerHTML =
        "<p>कोई योजना नहीं मिली। दूसरी खोज करें।</p>";

      return;
    }

    list.forEach(scheme => {

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <h3>${scheme.name}</h3>

        <span class="tag">
          ${scheme.category}
        </span>

        <p>
          ${scheme.description}
        </p>

        <a
          class="apply"
          href="${scheme.url}"
          target="_blank"
        >
          आधिकारिक वेबसाइट
        </a>
      `;

      container.appendChild(card);

    });

  }


  function searchSchemes() {

    const query =
      document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

    if (!query) {

      displaySchemes(schemes);

      return;
    }

    const result = schemes.filter(scheme =>

      scheme.name.toLowerCase().includes(query) ||

      scheme.category.toLowerCase().includes(query) ||

      scheme.description.toLowerCase().includes(query)

    );

    document.getElementById("status").innerText =
      result.length + " योजना मिली";

    displaySchemes(result);
  }


  async function askAI() {

    const question =
      document.getElementById("question").value.trim();

    const answerBox =
      document.getElementById("aiAnswer");

    if (!question) {

      answerBox.innerText =
        "कृपया अपना सवाल लिखें।";

      return;
    }

    answerBox.innerText =
      "⏳ Grok जानकारी खोज रहा है...";


    try {

      const response = await fetch(
        "https://api.x.ai/v1/responses",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization":
              "Bearer " + XAI_API_KEY
          },

          body: JSON.stringify({

            model: "grok-4.7",

            input:
              `आप भारत सरकार की योजनाओं के हिंदी AI सहायक हैं।

केवल विश्वसनीय और आधिकारिक जानकारी के आधार पर उत्तर दें।

यूजर का सवाल:
${question}

उत्तर सरल हिंदी में दें।

यदि योजना की पात्रता, राशि या आवेदन प्रक्रिया
समय के साथ बदल सकती है तो यूजर को
आधिकारिक सरकारी वेबसाइट पर जानकारी verify
करने की सलाह दें।`

          })
        }
      );


      const data = await response.json();

      if (!response.ok) {

        throw new Error(
          data.error?.message ||
          "API Error"
        );

      }

      answerBox.innerText =
        data.output_text ||
        "उत्तर प्राप्त नहीं हुआ।";

    }

    catch (error) {

      answerBox.innerText =
        "❌ समस्या: " + error.message;

    }

  }


  // Website खुलते ही योजनाएँ दिखाएँ
  displaySchemes(schemes);

</script>

</body>
  </html>
